<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>StudentMS - Login</title>

    <link rel="stylesheet" href="/login.css">

</head>

<body>

<div class="login-container">

    <!-- ================================================= -->
    <!-- LOGIN CARD -->
    <!-- ================================================= -->

    <div class="login-card">


        <!-- ================================================= -->
        <!-- LOGO -->
        <!-- ================================================= -->

        <div class="login-logo">

            <div class="logo-icon">
                S
            </div>

            <h1>
                StudentMS
            </h1>

            <p>
                Student Management System
            </p>

        </div>


        <!-- ================================================= -->
        <!-- LOGIN HEADER -->
        <!-- ================================================= -->

        <div class="login-header">

            <h2>
                Welcome Back
            </h2>

            <p>
                Sign in to access the administrator dashboard.
            </p>

        </div>


        <!-- ================================================= -->
        <!-- LOGIN FORM -->
        <!-- ================================================= -->

        <form
                id="loginForm"
                action="/login"
                method="POST"
        >


            <!-- ================================================= -->
            <!-- USERNAME -->
            <!-- ================================================= -->

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                >

            </div>


            <!-- ================================================= -->
            <!-- PASSWORD -->
            <!-- ================================================= -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                >

            </div>


            <!-- ================================================= -->
            <!-- ERROR MESSAGE -->
            <!-- ================================================= -->

            <div
                    id="errorMessage"
                    class="message error-message"
                    style="display: none;"
            >

                Invalid username or password.

            </div>


            <!-- ================================================= -->
            <!-- LOGOUT MESSAGE -->
            <!-- ================================================= -->

            <div
                    id="logoutMessage"
                    class="message success-message"
                    style="display: none;"
            >

                You have been logged out successfully.

            </div>


            <!-- ================================================= -->
            <!-- LOGIN MESSAGE -->
            <!-- ================================================= -->

            <div
                    id="loginMessage"
                    class="message"
            >

            </div>


            <!-- ================================================= -->
            <!-- LOGIN BUTTON -->
            <!-- ================================================= -->

            <button
                    type="submit"
                    class="login-button"
            >

                Sign In

            </button>


        </form>


        <!-- ================================================= -->
        <!-- FOOTER -->
        <!-- ================================================= -->

        <div class="login-footer">

            <p>
                Student Management System
            </p>

            <span>
                Version 1.0
            </span>

        </div>


    </div>

</div>


<!-- ================================================= -->
<!-- JAVASCRIPT -->
<!-- ================================================= -->

<script src="/login.js"></script>

</body>

</html>
